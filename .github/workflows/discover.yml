name: Discover ATS Mapping

# Run manually from the Actions tab whenever you add/change companies
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python discover_ats.py

      - name: Commit results
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add companies_matched.json companies_unmatched.txt
          git commit -m "Update ATS discovery results" || echo "No changes to commit"
          git push
